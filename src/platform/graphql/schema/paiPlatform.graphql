}

type AgentContext {
  focus: JSON!
}

input AgentContextInput {
  include: [String!]
  jobId: String
  panelId: String
  projectId: String!
  sceneId: String
  threadId: String
}

enum AssetKind {
  ANNOTATION
  ENTITY_IMAGE
  ENTITY_MODEL_3D
  RENDER
  SOURCE_SCRIPT
  STORYBOARD
}

type AssetUploadUrl {
