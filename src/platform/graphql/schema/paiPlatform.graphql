type JobDebug {
  diagnostics: JSON!
  job: JSON!
  request: JSON!
  result: JSON!
  worker: JSON
  workerTask: JSON
}

type LogoutPayload {
  loggedOut: Boolean!
}

type Mutation {
  addChatMessage(input: ChatMessageInput!, threadId: String!): ChatMessage!
  cleanProjectWorktree(projectId: String!): ProjectVersionCleanResult!
  commitProjectVersion(comment: String!, projectId: String!): ProjectVersionCommitResult!
  createAssetUploadUrl(assetKind: AssetKind!, contentType: String!, projectId: String!): AssetUploadUrl!
  createChatThread(input: ChatThreadInput!): ChatThread!
  createProject(input: CreateProjectInput!): ProjectCreateResult!
  deletePaceFiles(paths: [String!]!, projectId: String!): PaceFilesDeleteResult!
  deleteProject(projectId: String!): ProjectDeleteResult!
  deleteProjectVersion(projectId: String!, versionId: String!): ProjectVersionDeleteResult!
  heartbeatWorker(input: WorkerHeartbeatInput!, workerName: String!): WorkerHeartbeatResult!
  login(email: String!, password: String!): AuthPayload!
  logout: LogoutPayload!
  register(displayName: String!, email: String!, password: String!): AuthPayload!
  registerWorker(input: WorkerRegistrationInput!): WorkerRegistrationResult!
  restoreProjectVersion(projectId: String!, versionId: String!): ProjectVersionRestoreResult!
  runWorkerTask(payload: JSON, projectId: String!, taskType: String!, workerName: String!): WorkerTaskSubmitResult!
  sendAgentMessage(input: AgentChatInput!): AgentChatResult!
  updateWorkerRegistration(input: WorkerRegistrationInput!, workerName: String!): WorkerRegistrationResult!
  writePaceFiles(patches: [PaceFilePatchInput!], projectId: String!, writes: [PaceFileWriteInput!]): PaceFilesWriteResult!
}

type PaceArtifactItem {
  """记录创建时间,使用 ISO 8601 字符串。"""
  createdAt: String
  """创建者或创建来源。"""
  createdBy: JSON
  field(path: String!): JSON
  """原始文件名或展示名,非路径真值"""
  filename: String
  """
  产物类型,如 source_script_file/source_script_text/storyboard_pdf/storyboard_html/v1_storyboard/reference_video/blender_file/previs_take/final_take/audio_mix/...;source_script_file 表示前端/平台上传的原始剧本文件,可作为 split_script 输入源;source_script_text 表示解析后或规范化后的剧本文本,二者可共存。
  """
  kind: String!
  """MIME type,如 application/pdf 或 text/html"""
  mediaType: String
  """备注。"""
  note: String
  """仅 shot/panel 级产物使用;项目级和场景级产物不填"""
  panelId: String
  """产物来源"""
  source: PaceArtifactItemSourceEnum
  """产物状态;默认语义为 ready"""
  status: PaceArtifactItemStatusEnum
  """被当前记录取代的 artifact/version id"""
  supersedesId: String
  """标签列表。"""
  tags: [String]
  """二进制或大文件一律对象存储 assets:// URI;不得持久化签名 URL / CDN URL / HTTP(S) URL"""
  uri: String!
  """可选 take / 修订 id"""
  versionId: String
}

enum PaceArtifactItemSourceEnum {
  imported
  tool_generated
  uploaded
  worker_generated
}

enum PaceArtifactItemStatusEnum {
  failed
  processing
  ready
  rejected
}

"""角色造型卡,用于资产库按造型渲染。"""
type PaceAssetAppearance {
  """角色年龄或阶段状态。"""
  ageState: String
  """服装描述。"""
  costume: String
  field(path: String!): JSON
  """图像资产引用。"""
  image: PaceAssetRef
  """三维模型资产引用。"""
  model3d: PaceAssetRef
}

"""资产在某种年龄、服装、状态或场景下的表现。"""
type PaceAssetDepiction {
  """角色年龄或阶段状态。"""
  ageState: String
  """服装描述。"""
  costume: String
  field(path: String!): JSON
  """图像资产引用。"""
  image: PaceAssetRef
  """妆发或配饰备注。"""
  makeup: String
  """三维模型资产引用。"""
  model3d: PaceAssetRef
  """该表现适用的单个场景 ID。"""
  sceneId: String
  """适用场景 ID 列表。"""
  scenes: [String]
  """道具或资产状态。"""
  state: String
}

type PaceAssetEntry {
  """年龄态字典或 map。"""
  ageStates: JSON
  """参考锚或形象锚。"""
  anchor: String
  """动画或运动配置。"""
  animation: JSON
  """角色造型卡列表。"""
  appearances: [PaceAssetAppearance]
  """外部系统资产 ID 或迁移来源 ID。PACE 内部引用必须优先使用 id。"""
  assetId: String
  """道具或资产分类。"""
  category: String
  """连续性卡片逐行条目。"""
  continuityCard: [String]
  """连续性状态字典或 map。"""
  continuityStates: JSON
  """服装字典或 map。"""
  costumes: JSON
  """资产在不同状态或场景中的表现列表。"""
  depictions: [PaceAssetDepiction]
  """实体描述。"""
  description: String
  """导演备注。"""
  directorNotes: String
  field(path: String!): JSON
  """通用形象锚字典或 map。"""
  genericAnchors: JSON
  """
  PACE 资产 canonical ID。必须小写并带类型前缀:char_/prop_/loc_/voice_,例如 char_yan_liang、prop_green_dragon_saber、loc_xuchang_camp、voice_yan_liang_main。版本信息写入 version 字段;引用字段可在 ID 后追加 @version。
  """
  id: String!
  """图像资产引用。"""
  image: PaceAssetRef
  """LoRA 资产引用。"""
  lora: JSON
  """三维模型资产引用。"""
  model3d: PaceAssetRef
  """显示名称。"""
  name: String
  """物理属性字典或 map。"""
  physicalAttributes: JSON
  """制作备注。"""
  productionNotes: String
  """外部或内部引用集合。"""
  refs: [String]
  """出现的 scene ID 列表。"""
  scenes: [String]
  """地点设定,如内景/外景等。"""
  setting: String
  """出现的 shot ID 列表。"""
  shots: [String]
  """角色或资产分级。"""
  tier: String
  """LoRA 或形象触发词。"""
  trigger: String
  """资产版本标签。"""
  version: String
  """语音或音色 ID。"""
  voiceId: String
}

"""
文件:entities/characters.json、entities/props.json、entities/locations.json、entities/voices.json。实体资产台账 schema,定义角色、道具、地点、声音等资产索引及其 depictions 表示。
"""
type PaceAssetIndex {
  field(path: String!): JSON
  items: [PaceAssetEntry]!
}

type PaceAssetRef {
  field(path: String!): JSON
  """字段或记录来源。"""
  source: JSON
  """当前状态。"""
  status: PaceAssetRefStatusEnum
  """assets:// URI。"""
  uri: String
}

enum PaceAssetRefStatusEnum {
  failed
  generating
  idle
  ready
}

"""
文件:delivery/delivery_manifest.json(08 目录树中 delivery/ 下唯一的文件)。交付清单:master/分镜片段的 assets:// 引用 + 规格 + 校验和。owner:S3/POST 阶段写,QA 验收读。
"""
type PaceDeliveryManifest {
  """验收人(人名/账号);null = 未验收"""
  approvedBy: String
  """ISO 8601 时间戳"""
  createdAt: String
  """交付项列表,append-only:只增不改;重交付 = 追加新条目 + 新 versionId,旧条目保留作血缘"""
  deliverables: [PaceDeliveryManifestDeliverablesItem]!
  field(path: String!): JSON
  """项目 ID(与工程目录根一致)"""
  projectId: String!
  """标准版本号"""
  schemaVersion: String!
}

type PaceDeliveryManifestDeliverablesItem {
  """完整性校验和(交付验收依据)"""
  checksum: PaceDeliveryManifestDeliverablesItemChecksum
  """时长(秒)"""
  durationS: Float
  field(path: String!): JSON
  """容器/编码,如 mp4/h264、mov/prores422、wav/pcm24"""
  format: String
  """有理数帧率(23.976=24000/1001),禁浮点——与 camera.fps 同规则(C-C)"""
  fps: PaceDeliveryManifestDeliverablesItemFps
  """
  master=成片 / scene_cut=场级剪段 / shot_take=镜头级片段 / trailer=预告 / audio_mix=混音轨 / subtitle=字幕 / other=其余(note 必须说明)
  """
  kind: PaceDeliveryManifestDeliverablesItemKindEnum!
  """给人看的备注(kind=other 时必填说明)"""
  note: String
  """[宽, 高] 像素"""
  resolution: [Int]
  """kind=scene_cut/shot_take 时填;结构 ID(s001)"""
  sceneId: String
  """kind=shot_take 时填;结构 ID(hs001_sh003)"""
  shotId: String
  """二进制成片一律 assets:// URI(契约 §4.1);字幕等纯文本允许工程内相对路径"""
  uri: String!
  """对应 semantics.version 血缘链中的 take id(交付物可溯源到具体 take)"""
  versionId: String
}

"""完整性校验和(交付验收依据)"""
type PaceDeliveryManifestDeliverablesItemChecksum {
  """摘要算法,新交付建议 sha256"""
  algo: PaceDeliveryManifestDeliverablesItemChecksumAlgoEnum!
  field(path: String!): JSON
  """十六进制摘要值"""
  value: String!
}

enum PaceDeliveryManifestDeliverablesItemChecksumAlgoEnum {
  md5
  sha256
}

"""有理数帧率(23.976=24000/1001),禁浮点——与 camera.fps 同规则(C-C)"""
type PaceDeliveryManifestDeliverablesItemFps {
  """分母"""
  denom: Int!
  field(path: String!): JSON
  """分子"""
  num: Int!
}

enum PaceDeliveryManifestDeliverablesItemKindEnum {
  audio_mix
  master
  other
  scene_cut
  shot_take
  subtitle
  trailer
}

union PaceDocument = PaceAssetIndex | PaceDeliveryManifest | PaceGenericDocument | PacePanelManifest | PaceProjectManifest | PaceSceneManifest | PaceShotManifest

