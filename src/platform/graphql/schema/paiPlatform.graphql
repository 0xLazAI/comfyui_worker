  chatMessages(threadId: String!): [ChatMessage!]!
  chatThread(threadId: String!): ChatThread!
  chatThreads(projectId: String!): [ChatThread!]!
  job(jobId: String!, projectId: String!, refresh: Boolean): Job!
  jobDebug(jobId: String!, refresh: Boolean = false): JobDebug!
  jobs(kind: String, limit: Int = 100, projectId: String!, refresh: Boolean): [Job!]!
  paceFile(path: String!, projectId: String!): PaceFile!
  paceFileIndex(prefix: String!, projectId: String!): [PaceFileMeta!]!
  paceStandard: PaceStandard!
  paceStandardRegistry(name: String): JSON!
  paceStandardSchema(name: String): JSON!
  paceStandardVocab(name: String): JSON!
  project(id: String!): Project
  projectTree(projectId: String!): ProjectTree!
  projectVersion(projectId: String!): ProjectVersionState!
  projectVersions(limit: Int = 50, projectId: String!): [ProjectVersion!]!
  projects: [Project!]!
  validatePaceProject(projectId: String!): PaceValidation!
  viewer: User
  workers(verbose: Boolean = false): [Worker!]!
