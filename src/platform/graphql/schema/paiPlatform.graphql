  medium
  medium_close_up
  medium_full
  wide
}

"""摄影机外参、机位和朝向。"""
type PacePillarCameraExtrinsics {
  """拍摄角度。"""
  angle: PacePillarCameraExtrinsicsAngleEnum
  field(path: String!): JSON
  """机位位置。"""
  position: PacePillarCameraExtrinsicsPositionEnum
