}

"""摄影机内参和镜头参数。"""
type PacePillarCameraIntrinsics {
  """dormant(C-F)"""
  anamorphicSqueeze: Float
  """光圈描述。"""
  aperture: PacePillarCameraIntrinsicsApertureEnum
  """F 制光圈值。"""
  apertureF: Float
  """景深控制。"""
  depthOfField: PacePillarCameraIntrinsicsDepthOfFieldEnum
  """dormant(C-B, OpenLensIO)"""
  distortion: PacePillarCameraIntrinsicsDistortion
  """dormant(C-E)"""
  encoders: PacePillarCameraIntrinsicsEncoders
  """米, dormant(C-G)"""
  entrancePupilOffset: Float
  field(path: String!): JSON
  """焦距,单位毫米。"""
  focalLengthMm: Float
  """对焦距离,单位米。"""
  focusDistanceM: Float
  """ISO 描述。"""
  iso: PacePillarCameraIntrinsicsIsoEnum
  """ISO 数值。"""
  isoValue: Int
  """镜头规格或镜头尺寸描述。"""
  lensSize: PacePillarCameraIntrinsicsLensSizeEnum
  """[w,h] 物理片门 mm;缺省 36x24。修『焦距→视场角』歧义(C-A)"""
  sensorMm: [Float]
  """快门角度,单位度。"""
  shutterAngleDeg: Float
  """快门速度。"""
  shutterSpeed: PacePillarCameraIntrinsicsShutterSpeedEnum
  """T 制光圈值。"""
  tStop: Float
}

enum PacePillarCameraIntrinsicsApertureEnum {
