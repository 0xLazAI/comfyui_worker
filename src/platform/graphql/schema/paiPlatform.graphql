"""
文件:scenes/<sceneId>/shots/<shotId>/panels/<panelId>/manifest.json。panel = 唯一被渲染的叶子,**panel 层单一真值**。panel 不再承载四柱 override;四柱真值在 shot 层。required:schemaVersion+panelId。owner:S1 建骨架。
"""
type PacePanelManifest {
  """panel 级产物索引(append-only),如该关键帧的标注 JSON、参考图或局部输出。"""
  artifacts: [PaceArtifactItem]
  field(path: String!): JSON
  """是否作为关键帧参与渲染/批量网格;为空表示由 worker 默认策略决定。"""
  isKeyframe: Boolean
  """visual=正常画面 / title_card=字卡 / black=黑屏过场 / meta=非渲染占位;仅 visual 进图像后端"""
  kind: PacePanelManifestKindEnum
  """panel 级渲染模型/工作流选择;为空表示使用 worker 或项目默认值。"""
  model: String
  """给人看的备注;编译器不消费"""
  notes: String
  """结构 ID(平台契约 §4.3,如 ps001_sh003_p0001);与所属 panel 目录名一致"""
  panelId: String!
  """shot 内序号,从 1 起"""
  panelNumber: Int
  """
  override:仅当该 panel 焦点与 shot 级 setup.primaryFocus 不同时才写;真值在 shot 级,缺失即继承(形状同 setup.primaryFocus:{type, ref, ofCharacter?, coveragePct?})
  """
  primaryFocus: PacePanelManifestPrimaryFocus
  """前镜/连续性参考图的 assets:// URI;不得保存签名 URL 或 HTTP(S) URL。"""
  sceneReference: String
  """标准版本号"""
  schemaVersion: String!
  """panel 级渲染随机种子;为空表示由 worker 自动生成。"""
  seed: Int
  """风格参考图 assets:// URI 列表;不得保存签名 URL 或 HTTP(S) URL。"""
  styleReferences: [String]
}

enum PacePanelManifestKindEnum {
  black
  meta
  title_card
  visual
}

"""
override:仅当该 panel 焦点与 shot 级 setup.primaryFocus 不同时才写;真值在 shot 级,缺失即继承(形状同 setup.primaryFocus:{type, ref, ofCharacter?, coveragePct?})
"""
type PacePanelManifestPrimaryFocus {
  """画面覆盖比例,0 到 100。"""
  coveragePct: Int
  field(path: String!): JSON
  """type=feature 时必填。角色资产 ID,可追加 @version。"""
  ofCharacter: String
  """实体或资产引用。"""
  ref: String!
  """对象类型。"""
  type: PacePanelManifestPrimaryFocusTypeEnum!
}

enum PacePanelManifestPrimaryFocusTypeEnum {
  character
  environment
  feature
  object
}

"""PACE camera pillar schema。定义镜头摄影机、镜头语言和运动轨迹真值。"""
type PacePillarCamera {
  """镜头创作意图。"""
  creativeIntent: PacePillarCameraCreativeIntent
  """摄影机外参、机位和朝向。"""
  extrinsics: PacePillarCameraExtrinsics
  field(path: String!): JSON
  """有理数帧率(23.976=24000/1001), 禁浮点(C-C)"""
  fps: PacePillarCameraFps
  """帧范围。"""
  frameRange: [Int]
  """摄影机内参和镜头参数。"""
  intrinsics: PacePillarCameraIntrinsics
  """
  运镜程序(自 PAILang camera.program 吸收转正——此前是其 studio 写入的越 schema 野字段)。与 trajectory 的关系:program 是「怎么算出轨迹」的可复现配方(真值),trajectory.camera_path 是算出来的 6-DoF 关键帧 artifact(产物);两者并存,符合「字段是真值,prompt/轨迹是产物」铁律。
  """
  program: PacePillarCameraProgram
  """摄影机运动轨迹。"""
  trajectory: PacePillarCameraTrajectory
}

"""镜头创作意图。"""
type PacePillarCameraCreativeIntent {
  """画幅比例。"""
  aspectRatio: String
  field(path: String!): JSON
  """构图方式。"""
  framing: PacePillarCameraCreativeIntentFramingEnum
  """景别。"""
  shotSize: PacePillarCameraCreativeIntentShotSizeEnum
}

enum PacePillarCameraCreativeIntentFramingEnum {
  crowd
  empty
  insert
  ots
  pov
  single
  two_shot
}

enum PacePillarCameraCreativeIntentShotSizeEnum {
