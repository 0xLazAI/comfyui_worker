[supervisord]
logfile=/dev/null
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:comfyui-worker]
directory=/app
command=/bin/sh -lc 'exec node /app/dist/queue/worker-cli.js'
autostart=true
autorestart=true
startsecs=1
startretries=999
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
